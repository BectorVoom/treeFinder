[package]
name = "tree_finder"
version = "0.1.0"
edition = "2024"

[lib]
name = "tree_finder"
path = "src/lib.rs"

[[bin]]
name = "tree_finder"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.103"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.2", features = ["derive"] }
diffy = "0.5.0"
pulldown-cmark = "0.13.4"
rmcp = { version = "3.1.2", features = ["server", "transport-io"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.53.0", features = ["rt-multi-thread", "macros", "io-util", "sync", "time"] }
ulid = "3.0.0"
uuid = { version = "1.24.0", features = ["v4"] }

[dev-dependencies]
rmcp = { version = "3.1.2", features = ["client"] }
tempfile = "3.27.0"
